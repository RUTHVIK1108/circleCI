version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11   # Pulls the official CircleCI Python image
    steps:
      - checkout                  # Checks out code from your GitHub repo
      - run: python main.py

  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run: python -m unittest tests.py

workflows:
  build_and_test:
    jobs:
      - build
      - test:
          requires:
            - build              # Runs tests only after the build job passes successfully

